.lp-hbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);transform:translateX(-120%);animation:lpsweep 4.5s ease-in-out 1.6s infinite;z-index:-1}
.lp-hbtn .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#2A1E12;color:#F2D27A;flex:none}
.lp-hbtn .ic svg{width:24px;height:24px}
.lp-hbtn .tx{display:grid;text-align:left;font:700 clamp(17px,1.4vw,20px)/1.15 "Inter Tight",sans-serif;letter-spacing:-.015em}
.lp-hbtn .tx small{font-size:12.5px;font-weight:500;letter-spacing:0;opacity:.75;margin-top:3px}
.lp-hbtn .ar{font-size:22px;padding:0 8px 0 6px;transition:transform .2s}
.lp-hbtn:hover{transform:translateY(-2px)}.lp-hbtn:hover .ar{transform:translateX(4px)}
.lp-hbtn:active{transform:translateY(0) scale(.98)}
.lp-hbtn:focus-visible{outline:2px solid #2A1E12;outline-offset:8px}
.lp-hghost{font-weight:600;color:#7A5410;text-decoration:none;border-bottom:1.5px solid rgba(122,84,16,.45);padding-bottom:2px}
.lp-hghost:hover{border-color:#7A5410}
.lp .lp-hbtn{color:#2A1E12}.lp .lp-hghost{color:#7A5410}
@keyframes lpsweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
@media (max-width:700px){.lp-hero{padding:130px 18px 110px}.lp-hero .hl{font-size:clamp(40px,12vw,56px)}.lp-hero .h1w{margin-top:70px}.lp-hero .acts{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.lp-hbtn::after,.lp-hero .hl .g{animation:none}}
@media (prefers-reduced-motion:reduce){.js .lp .rv{opacity:1;transform:none;transition:none}.lp-hero .slot img{animation:none}.lp-nav{transition:none}}
.lp ~ .ctabar{box-shadow:none}

.lp-tiles:not(.all) .lp-tile:nth-child(n+13){display:none}
.lp [id]{scroll-margin-top:76px}
body:has(.lp){background:#fff}
.lp ~ .ctabar{border-top:0;background:#1A0B10;color:#fff;font-family:"Inter Tight",sans-serif}
.lp ~ .ctabar .p small{font-size:13px;letter-spacing:0;text-transform:none;color:#C9BBBF}
.lp ~ .ctabar .p b{font-family:"Inter Tight",sans-serif;font-weight:600;color:#fff}
.lp ~ .ctabar .btn{border-radius:0;background:#F0BE4C;border-color:#F0BE4C;color:#1A0B10;text-transform:none;letter-spacing:0;font-family:"Inter Tight",sans-serif;font-weight:600;box-shadow:none}
.lp ~ .ctabar .wa-ic{border-radius:0;border:0;background:#2A141B;color:#fff}
.lp #editor{font-family:"Inter Tight","Noto Sans Sinhala",sans-serif}
.lp #editor h2{font-size:26px;letter-spacing:-.025em;line-height:1.1;font-weight:600}
.lp #editor .type b,.lp #editor .tpl .nm,.lp #editor .glist .who b{font-family:inherit;font-weight:600}
.lp #editor .eyebrow{display:none}
.lp #editor .panel{box-shadow:none;border:0;background:var(--l-tone);border-radius:0}
.lp #editor .panel::before,.lp #editor .panel::after{display:none}
.lp #editor .stage .table{background:var(--l-tone);border:0;box-shadow:none}
.lp #editor .sample,.lp #editor .linkbtn,.lp #editor .hint,.lp #editor .btn,.lp #editor .sub,.lp #editor .pnote{font-size:14px}
.lp #editor .btn{text-transform:none;letter-spacing:0;border-radius:0;font-family:"Inter Tight",sans-serif;font-weight:600}
</style>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  FREE_GUESTS: 5,
  STUDIO_WA: "94770000000",          // Aradhanawa studio WhatsApp number (replace with the real one)
  PRICE_PLUS: "Rs. 990",
  PRICE_CUSTOM: "Rs. 4,900",
  MUSIC: "audio/jayamangala-gatha.mp3",   // background music for the Lotus Mandala design (put your MP3 here)
  // Base URL for share links. On a static host (Netlify, GitHub Pages, Vercel) the page itself is used.
  SITE: (location.protocol.startsWith("http") && !/claude|anthropic|usercontent/.test(location.hostname))
          ? location.origin + location.pathname : "https://aradhanawa.com/"
};

/* ================= SVG ART ================= */
const svg = (vb, inner) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;

function lotus(x,y,s,c1,c2){return `<g transform="translate(${x} ${y}) scale(${s})">
<path d="M0 0C-28-4-46-16-52-30C-34-28-14-16 0 0Z" fill="${c1}" opacity=".8"/>
<path d="M0 0C28-4 46-16 52-30C34-28 14-16 0 0Z" fill="${c1}" opacity=".8"/>
<path d="M0 0C-20-12-30-30-28-46C-14-38-4-20 0 0Z" fill="${c2}"/>
<path d="M0 0C20-12 30-30 28-46C14-38 4-20 0 0Z" fill="${c2}"/>
<path d="M0 0C-10-20-10-40 0-56C10-40 10-20 0 0Z" fill="${c1}"/>
<path d="M-40 2Q0 12 40 2" stroke="${c2}" stroke-width="2" fill="none"/></g>`}

function polMal(x,y,c,pot){return `<g transform="translate(${x} ${y})">
${Array.from({length:15},(_,i)=>{const a=(-75+i*150/14)*Math.PI/180, L=34+((i*7)%3)*6, ex=Math.sin(a)*L, ey=-Math.cos(a)*L;return `<path d="M0 -14Q${ex*.3} ${-14+ey*.6} ${ex} ${-14+ey}" stroke="${c}" stroke-width="1.3" fill="none"/><circle cx="${ex}" cy="${-14+ey}" r="1.6" fill="${c}"/>`}).join("")}
<path d="M-12 -14H12L10 -8Q18 4 0 10Q-18 4 -10 -8Z" fill="${pot}"/><path d="M-9 10H9V13H-9Z" fill="${pot}"/></g>`}
function lamp(x,y,c){return `<g transform="translate(${x} ${y})"><path class="flame" d="M6-30c-3-4-1-8 0-11c1 3 3 7 0 11z" fill="#F29A1E"/><path d="M-9-28Q0-18 9-28Z" fill="${c}"/><rect x="-1.5" y="-24" width="3" height="20" fill="${c}"/><path d="M-8 0H8L5-4H-5Z" fill="${c}"/></g>`}
function poruwa(g,soft){return `
<path d="M160 6l3 8h-6z" fill="${g}"/><circle cx="160" cy="16" r="3" fill="${g}"/>
<path d="M124 38Q160 12 196 38L204 44Q160 26 116 44Z" fill="${g}"/>
<path d="M118 44H202V48H118Z" fill="${g}" opacity=".7"/>
<path d="M96 60Q160 30 224 60L240 70Q160 44 80 70Z" fill="${g}"/>
<path d="M90 70H230V75H90Z" fill="${g}" opacity=".7"/>
${[100,128,192,220].map((x,i)=>`<rect x="${x-3}" y="75" width="6" height="45" fill="${g}" opacity="${i%3?".75":"1"}"/><rect x="${x-5}" y="75" width="10" height="4" fill="${g}"/><rect x="${x-5}" y="116" width="10" height="4" fill="${g}"/>`).join("")}
<path d="M100 80Q114 96 128 80M128 80Q160 104 192 80M192 80Q206 96 220 80" stroke="${soft}" stroke-width="1.6" stroke-dasharray="1 3" stroke-linecap="round" fill="none"/>
${[114,160,206].map(x=>`<path d="M${x} ${x===160?92:88}v10" stroke="${soft}" stroke-width="1.4" stroke-dasharray="1 3" stroke-linecap="round"/>`).join("")}
<path d="M84 120H236V127H84Z" fill="${g}"/><path d="M74 127H246V134H74Z" fill="${g}" opacity=".8"/><path d="M64 134H256V141H64Z" fill="${g}" opacity=".6"/>
<path d="M132 120h56" stroke="${soft}" stroke-width="2"/>`}
function weddingArt(){
  const g="var(--c-gold)", s="var(--c-soft)";
  return svg("0 0 320 150",`
  ${poruwa(g,s)}
  ${polMal(38,140,s,g)}${polMal(282,140,s,g)}
  ${lamp(70,141,g)}${lamp(250,141,g)}
  <path d="M10 141H310" stroke="${g}" stroke-width="1" opacity=".5"/>`)
}
function palm(x,y,s,c){return `<g transform="translate(${x} ${y}) scale(${s})">
<path d="M0 0Q6-50 2-96" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M2-96Q-30-110-56-90Q-30-100 2-96ZM2-96Q30-116 58-96Q30-104 2-96ZM2-96Q-14-128-40-130Q-18-118 2-96ZM2-96Q20-130 46-128Q22-118 2-96ZM2-96Q-40-90-50-64Q-34-86 2-96ZM2-96Q40-90 50-62Q34-86 2-96Z" fill="${c}"/>
<circle cx="-2" cy="-92" r="4" fill="${c}"/><circle cx="6" cy="-90" r="4" fill="${c}"/></g>`}
function homecomingArt(){
  const g="var(--c-gold)", s="var(--c-soft)";
  return svg("0 0 320 150",`
  <circle cx="160" cy="58" r="44" fill="${g}" opacity=".9"/>
  <path d="M0 136Q80 124 160 132T320 128V150H0Z" fill="${s}" opacity=".22"/>
  ${palm(40,140,.95,s)}${palm(284,142,.8,s)}
  <g transform="translate(160 0)">
    <path d="M-86 92L0 54L86 92Z" fill="#B5502F"/>
    ${[-60,-40,-20,0,20,40,60].map(x=>`<path d="M${x*.95} ${92-Math.max(0,38-Math.abs(x)*.44)}L${x} 92" stroke="#8E3A20" stroke-width="1"/>`).join("")}
    <path d="M-92 92H92V97H-92Z" fill="${g}"/>
    <path d="M-76 97H76V128H-76Z" fill="#FFFDF8" stroke="var(--c-gold)" stroke-width="1"/>
    ${[-64,-32,32,64].map(x=>`<rect x="${x-3}" y="97" width="6" height="31" fill="${g}"/>`).join("")}
    <path d="M-12 128V108Q0 98 12 108V128Z" fill="#0b302b"/>
    <path d="M-50 104h12v14h-12zM38 104h12v14h-12z" fill="#0b302b"/>
    <path d="M-86 128H86V134H-86Z" fill="${g}" opacity=".8"/>
    ${lamp(-20,128,g)}${lamp(20,128,g)}
    <path d="M-60 97Q-30 110 0 97Q30 110 60 97" stroke="${s}" stroke-width="1.4" stroke-dasharray="1 3" stroke-linecap="round" fill="none"/>
  </g>`)
}
function balloon(x,y,c,r){return `<g class="sway" style="animation-delay:${(x%7)/7}s"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.18}" fill="${c}"/><path d="M${x-r*.35} ${y-r*.5}q${r*.2}-${r*.35} ${r*.5}-${r*.4}" stroke="#fff" stroke-width="2" opacity=".55" fill="none"/><path d="M${x} ${y+r*1.18}l-3 5h6z" fill="${c}"/><path d="M${x} ${y+r*1.18+5}q-6 20 4 40" stroke="var(--c-soft)" fill="none" stroke-width="1"/></g>`}
function birthdayArt(){
  return svg("0 0 320 160",`
  ${balloon(48,40,"#E5533A",20)}${balloon(86,28,"#2F8F6B",16)}${balloon(268,36,"#F2A93B",20)}${balloon(232,24,"#5B6CD6",14)}
  <g transform="translate(160 0)">
    <rect x="-62" y="96" width="124" height="44" rx="6" fill="#D9573A"/>
    <path d="M-62 104q10 10 20 0t21 0t21 0t21 0t21 0t20 0" stroke="#FFF4DA" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-44" y="62" width="88" height="36" rx="6" fill="#F7D9A6"/>
    <path d="M-44 70q8 8 15 0t15 0t14 0t15 0t15 0t14 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#5A1A16">${[-26,-9,9,26].map(x=>`<rect x="${x-2}" y="44" width="4" height="18" rx="1" fill="${["#2F8F6B","#5B6CD6","#E5533A","#2F8F6B"][Math.abs(x)%4]}"/><path class="flame" d="M${x} 32c-4 5-4 9 0 11c4-2 4-6 0-11z" fill="#F2A93B"/>`).join("")}</g>
    <path d="M-80 140H80" stroke="#8A4A2B" stroke-width="2"/>
  </g>
  ${[[30,110],[290,100],[120,20],[200,14],[300,140],[16,150]].map(([x,y],i)=>`<rect x="${x}" y="${y}" width="6" height="3" rx="1" transform="rotate(${i*37} ${x} ${y})" fill="${["#E5533A","#2F8F6B","#5B6CD6","#F2A93B"][i%4]}"/>`).join("")}`)
}
function lantern(x,y,c,s,d){return `<g transform="translate(${x} ${y}) scale(${s})"><g class="sway" style="animation-delay:${d}s">
<line x1="0" y1="-22" x2="0" y2="-14" stroke="var(--c-soft)" stroke-width="1"/>
<circle cx="0" cy="0" r="22" fill="${c}" opacity=".18"/>
<path d="M0-14L15 0L0 14L-15 0Z" fill="${c}"/><path d="M0-14L0 14M-15 0H15" stroke="#fff" stroke-width=".8" opacity=".5"/>
<path d="M-15 0L-9-9M15 0L9-9M-15 0L-9 9M15 0L9 9" stroke="#fff" stroke-width=".6" opacity=".35"/>
<path d="M-8 8Q-12 26-10 42M-3 12Q-4 30-2 48M3 12Q4 30 2 48M8 8Q12 26 10 42" stroke="${c}" stroke-width="1.4" fill="none"/></g></g>`}
function partyArt(){
  const cs=["#F6C64F","#F27E6B","#6FD3C2","#B98CF2","#F6C64F"];
  return svg("0 0 320 160",`
  <path d="M0 18Q80 58 160 34T320 22" stroke="var(--c-soft)" stroke-width="1" fill="none" opacity=".6"/>
  ${[[38,40,0],[100,44,1],[160,36,2],[222,32,3],[284,24,4]].map(([x,y,i])=>lantern(x,y+14,cs[i],i===2?1.5:1.1,i*.35)).join("")}
  ${Array.from({length:18},(_,i)=>`<circle cx="${(i*53)%320}" cy="${118+((i*29)%40)}" r="${1+(i%3)*.6}" fill="#fff" opacity="${.3+(i%4)*.15}"/>`).join("")}
  <path d="M60 150Q160 120 260 150" stroke="var(--c-gold)" stroke-width="1" fill="none" opacity=".6"/>`)
}
function pahana(){return `
<circle cx="0" cy="-40" r="34" fill="var(--c-gold)" opacity=".08"/><circle cx="0" cy="-40" r="20" fill="var(--c-gold)" opacity=".12"/>
<path class="flame" d="M0-30C-7-40-3-52 0-62C3-52 7-40 0-30Z" fill="#F29A1E"/>
<path d="M0-33C-3-38-1-44 0-48C1-44 3-38 0-33Z" fill="#FFE28A"/>
<path d="M-46-24Q0 10 46-24Q30-18 0-18T-46-24Z" fill="var(--c-gold)"/>
<path d="M-46-24H46" stroke="var(--c-gold)" stroke-width="3" stroke-linecap="round"/>
<rect x="-6" y="-12" width="12" height="40" fill="var(--c-gold)"/>
<ellipse cx="0" cy="4" rx="14" ry="4" fill="var(--c-gold)"/>
<path d="M-34 40L34 40L24 28H-24Z" fill="var(--c-gold)"/>`}
function danaArt(){
  return svg("0 0 320 150",`
  ${lotus(70,128,.75,"var(--c-gold)","#E9A86A")}${lotus(250,128,.75,"var(--c-gold)","#E9A86A")}
  <g transform="translate(160 100)">${pahana()}</g>
  <path d="M30 134H290" stroke="var(--c-gold)" stroke-width="1" opacity=".5"/>
  ${[110,210].map(x=>`<circle cx="${x}" cy="120" r="3" fill="var(--c-gold)" opacity=".7"/>`).join("")}`)
}
function otherArt(){
  const g="var(--c-gold)";
  return svg("0 0 320 150",`
  <path d="M40 140V60Q40 18 160 14Q280 18 280 60V140" fill="none" stroke="${g}" stroke-width="2"/>
  <path d="M56 140V66Q56 32 160 28Q264 32 264 66V140" fill="none" stroke="${g}" stroke-width="1" opacity=".5"/>
  ${Array.from({length:9},(_,i)=>{const x=72+i*22;return `<path d="M${x} 40q4 14 0 26q-4-12 0-26z" fill="${i%2?g:"var(--c-soft)"}" opacity=".9"/>`}).join("")}
  ${lotus(160,128,.95,g,"var(--c-soft)")}
  <circle cx="160" cy="62" r="5" fill="${g}"/>`)
}
/* ---- extra template art ---- */
function flower(x,y,r,c,c2,rot=0){let p="";for(let i=0;i<5;i++)p+=`<ellipse cx="0" cy="${-r*.52}" rx="${r*.4}" ry="${r*.58}" fill="${c}" transform="rotate(${i*72+rot})"/>`;return `<g transform="translate(${x} ${y})">${p}<circle r="${r*.3}" fill="${c2}"/><circle r="${r*.12}" fill="${c}" opacity=".6"/></g>`}
function leafP(x,y,s,rot,c,o=1){return `<path d="M0 0Q${7*s} ${-7*s} ${17*s} 0Q${7*s} ${7*s} 0 0Z" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})" fill="${c}" opacity="${o}"/>`}
function floralArt(){
  const P0=[18,22],P1=[150,128],P2=[282,22],B=t=>[(1-t)**2*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)**2*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];
  const D=t=>Math.atan2(2*(1-t)*(P1[1]-P0[1])+2*t*(P2[1]-P1[1]),2*(1-t)*(P1[0]-P0[0])+2*t*(P2[0]-P1[0]))*180/Math.PI;
  let lv="";for(let t=.03,i=0;t<.98;t+=.055,i++){const [x,y]=B(t),a=D(t);lv+=leafP(x,y,1.05,a+(i%2?-38:38),i%2?"#7F9A78":"#A7BC9E",.95)}
  const fl=[[.13,9],[.3,6],[.5,13],[.7,6],[.87,9]].map(([t,r],i)=>{const [x,y]=B(t);return flower(x,y,r,i%2?"#F2D4CC":"var(--c-gold)",i%2?"var(--c-gold)":"#FBE9C8",i*17)}).join("");
  const buds=[.22,.4,.6,.78].map(t=>{const [x,y]=B(t);return `<circle cx="${x.toFixed(1)}" cy="${(y-6).toFixed(1)}" r="2.6" fill="var(--c-gold)" opacity=".7"/>`}).join("");
  return svg("0 0 300 132",`<path d="M${P0}Q${P1} ${P2}" fill="none" stroke="#8FA888" stroke-width="1.3"/>${lv}${buds}${fl}`);
}
function initials(type,ev){
  const f=s=>String(s||"").trim().charAt(0).toUpperCase();
  if(type==="wedding"||type==="homecoming") return [f(ev.a)||"A",f(ev.b)||"B"];
  const w=String(ev.title||ev.a||"A").split(/\s+/).filter(x=>/^[A-Za-z]/.test(x));
  return [f(w[0])||"A", w[1]?f(w[1]):""];
}
function monoArt(type,ev){
  const [x,y]=initials(type,ev);
  const sprig=(dx,flip)=>`<g transform="translate(${dx} 62) scale(${flip} 1)">${[0,1,2,3].map(i=>leafP(-4-i*9,-6+i*1,.62,200+i*8,"var(--c-gold)",.75)+leafP(-4-i*9,6-i*1,.62,160-i*8,"var(--c-gold)",.55)).join("")}</g>`;
  return svg("0 0 240 124",`<circle cx="120" cy="62" r="52" fill="none" stroke="var(--c-gold)" stroke-width="1.2"/><circle cx="120" cy="62" r="46" fill="none" stroke="var(--c-gold)" stroke-width=".6" opacity=".6"/>${sprig(62,1)}${sprig(178,-1)}
  <text x="120" y="${y?76:80}" text-anchor="middle" style="font-family:var(--f-display);font-weight:700;font-style:italic" font-size="${y?40:52}" fill="var(--c-ink)">${esc(x)}${y?`<tspan fill="var(--c-gold)" font-size="24" dy="-4"> &amp; </tspan><tspan dy="4">${esc(y)}</tspan>`:""}</text>
  <circle cx="120" cy="10" r="2.4" fill="var(--c-gold)"/><circle cx="120" cy="114" r="2.4" fill="var(--c-gold)"/>`);
}
function confettiArt(){
  const C=["#F2994A","#EB5757","#2D9CDB","#27AE60","#9B51E0","#F2C94C"];let s=7,r=()=>(s=(s*9301+49297)%233280)/233280,out="";
  for(let i=0;i<46;i++){const x=(r()*290+5).toFixed(0),y=(r()*96+6).toFixed(0),c=C[i%6],a=(r()*180).toFixed(0);out+=i%3?`<rect x="${x}" y="${y}" width="7" height="3.4" rx="1" fill="${c}" transform="rotate(${a} ${x} ${y})"/>`:`<circle cx="${x}" cy="${y}" r="${(2+r()*2).toFixed(1)}" fill="${c}"/>`}
  const st=(x,c)=>`<path d="M${x} 0q-10 18 4 34t-4 34" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>`;
  return svg("0 0 300 110",`${st(26,"#EB5757")}${st(272,"#2D9CDB")}${st(58,"#F2C94C")}${st(240,"#27AE60")}${out}`);
}
function premArt(type,t,ev){
  if(t.img) return pic(t.img,"(max-width:440px) 92vw, 380px",t.n,t.pos);
  if(t.layout==="floral") return floralArt();
  if(t.layout==="mono") return monoArt(type,ev||TYPES[type].sample);
  if(t.layout==="confetti") return confettiArt();
  if(t.layout==="lotus") return lxMandala("lx-cardm");
  return TYPES[type].art();
}

/* ================= LOTUS MANDALA THEME ================= */
function lxPetal(len,wid,rot,fill,stroke){return `<path d="M0 0C${wid} ${-len*.35} ${wid*.72} ${-len*.84} 0 ${-len}C${-wid*.72} ${-len*.84} ${-wid} ${-len*.35} 0 0Z" transform="rotate(${rot})" fill="${fill}" stroke="${stroke}" stroke-width=".7"/>`}

function lxAudio(){
  let a=document.getElementById("lxAudio");
  if(!a){ a=document.createElement("audio"); a.id="lxAudio"; a.loop=true; a.preload="none"; a.src=CONFIG.MUSIC||""; document.body.appendChild(a);
    a.addEventListener("error",()=>{ document.querySelectorAll("[data-music]").forEach(b=>b.hidden=true) });
    const st=()=>{ const on=!a.paused&&!a.muted; document.querySelectorAll("[data-music]").forEach(b=>{ b.classList.toggle("on",on); b.setAttribute("aria-pressed",String(!on)) }) };
    a.addEventListener("play",st); a.addEventListener("pause",st); a.addEventListener("volumechange",st); }
  return a;
}
function lxPlay(){ if(!CONFIG.MUSIC) return Promise.reject(); const a=lxAudio(); if(a.getAttribute("src")!==CONFIG.MUSIC) a.src=CONFIG.MUSIC; a.volume=.7; const r=a.play(); r.catch(()=>{}); return r }
/* browsers only allow sound after the guest touches the page: try at once, else start on the first tap, key or click anywhere */
const LX_EV=["pointerdown","touchend","keydown","click"];
function lxDisarm(){ LX_EV.forEach(t=>document.removeEventListener(t,lxKick,true)) }
function lxKick(e){ if(e&&e.target&&e.target.closest&&e.target.closest("[data-music]")) { lxDisarm(); return } lxDisarm(); lxPlay() }
function lxArm(){ if(!CONFIG.MUSIC||!document.querySelector(".site [data-music]")) return; lxDisarm(); lxPlay().catch(()=>{ LX_EV.forEach(t=>document.addEventListener(t,lxKick,{capture:true,passive:true})) }) }
function lxStop(){ lxDisarm(); const a=document.getElementById("lxAudio"); if(a) a.pause() }
document.addEventListener("click",e=>{
  const op=e.target.closest("[data-open]");
  if(op){ const site=op.closest(".site"); site.classList.add("opening"); lxPlay();
    setTimeout(()=>{ site.classList.remove("locked","opening"); const sc=site.closest(".screen"); (sc||window).scrollTo(0,0) },650); return }
  const m=e.target.closest("[data-music]"); if(m){ const a=lxAudio(); if(a.paused){ a.muted=false; lxPlay() } else a.muted=!a.muted; return }
  const mn=e.target.closest("[data-lxmenu]"); if(mn){ const p=mn.closest(".lx-fabs").querySelector(".lx-sheet"); p.hidden=!p.hidden; mn.setAttribute("aria-expanded",!p.hidden); return }
  if(e.target.closest(".lx-sheet [data-go]")){ const p=e.target.closest(".lx-sheet"); p.hidden=true }
});

/* ================= FORMATTERS ================= */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fDate(d,lang){
  if(!d) return "";
  const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d;
  try{ return dt.toLocaleDateString(lang==="si"?"si-LK":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) }catch(e){ return d }
}
function fTime(t,lang){
  if(!t) return "";
  let [h,m]=t.split(":").map(Number); if(isNaN(h)) return t;
  const am=h<12; const h12=((h+11)%12)+1; const mm=String(m||0).padStart(2,"0");
  if(lang==="si") return `${am?"පෙ.ව.":"ප.ව."} ${h12}.${mm}`;
  return `${h12}.${mm} ${am?"AM":"PM"}`;
}
function countdown(d,lang){
  if(!d) return "";
  const t=new Date(d+"T00:00:00"), n=new Date(); n.setHours(0,0,0,0);
  const x=Math.round((t-n)/864e5);
  if(x<0) return "";
  if(x===0) return lang==="si"?"අද දිනයි":"Today";
  return lang==="si"?`තව දින ${x}යි`:`In ${x} day${x>1?"s":""}`;
}
const intlPhone = p => { let d=String(p||"").replace(/\D/g,""); if(d.startsWith("0")) d="94"+d.slice(1); else if(d.length===9) d="94"+d; return d };
const prettyPhone = p => { const d=String(p||"").replace(/\D/g,""); return d.length===10?`${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}`:p };

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
async function copy(text, el){
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){
    if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl+C / long-press to copy"); }
    else toast("Copy blocked here. Select the text manually.");
  }
}
function modal(html){
  const L=document.getElementById("layer");
  L.innerHTML=`<div class="scrim" data-close><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  L.querySelector(".scrim").addEventListener("click",e=>{ if(e.target.hasAttribute("data-close")||e.target.closest("[data-x]")){ L.innerHTML=""; lxStop() } });
  const f=L.querySelector("input,button,a"); f&&f.focus();
}

function lpParse(t){
  t=String(t||"").trim(); let m;
  if((m=t.match(/^(.+?)\s*(?:&|\+|and|saha|සහ)\s*(.+)$/i))) return {type:"wedding",ev:{a:m[1].trim(),b:m[2].trim()}};
  if((m=t.match(/^(.+?)\s+turns?\s+(\d{1,3})/i))) return {type:"birthday",ev:{a:m[1].trim(),age:m[2]}};
  if((m=t.match(/^(.*?)\s*(?:dana|daana|දානය|pinkama)/i))){ const h=(m[1]||"").trim().replace(/^the\s+/i,""); return {type:"dana",ev:{a:h?"The "+h.replace(/^./,c=>c.toUpperCase()):"",title:"Sanghika Dana"}} }
  if(/party|reunion|night|bash|get.?together/i.test(t)) return {type:"party",ev:{title:t.replace(/^./,c=>c.toUpperCase()),a:""}};
  if(/homecoming/i.test(t)) return {type:"homecoming",ev:{a:"Kasun",b:"Tharushi"}};
  return {type:"other",ev:{title:t||"Engagement Ceremony"}};
}

function shrink(file){ return new Promise((res,rej)=>{
  const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
    const k=Math.min(1,800/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.72)) }; im.src=r.result }; r.readAsDataURL(file) }) }

function initSites(scope){

    const root=site.closest(".screen")||null, nav=site.querySelectorAll(".snav button[data-go]");
    if(!("IntersectionObserver" in window)) return;
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) nav.forEach(b=>b.setAttribute("aria-current", b.dataset.go===e.target.id)) }),{root,rootMargin:"-45% 0px -50% 0px"});
    nav.forEach(b=>{const t=document.getElementById(b.dataset.go); t&&io.observe(t)});

}
function tick(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    let ms=new Date(el.dataset.t)-new Date(); if(isNaN(ms)||ms<0) ms=0;
    const v={d:Math.floor(ms/864e5),h:Math.floor(ms/36e5)%24,m:Math.floor(ms/6e4)%60,s:Math.floor(ms/1e3)%60};
    el.querySelectorAll("[data-u]").forEach(b=>{b.textContent=String(v[b.dataset.u]).padStart(b.dataset.u==="d"?1:2,"0")});
  });
}

function gcalLink(type,ev){
  const T=TYPES[type]; const title=ev.title||(ev.b?`${ev.a} & ${ev.b} – ${T.name}`:`${ev.a} – ${T.name}`);
  const t=(ev.nekath||ev.time||"09:00").replace(":","");
  const d=(ev.date||"").replace(/-/g,"");
  const start=`${d}T${t}00`; const endH=String(Math.min(23,+t.slice(0,2)+4)).padStart(2,"0");
  const end=`${d}T${endH}${t.slice(2)}00`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start}/${end}&ctz=Asia/Colombo&location=${encodeURIComponent(ev.venue||"")}`;
}

function renderAuth(kind){
  const reg = kind==="register";
  if(me()){ location.replace(me().role==="admin"?"#admin":"#account"); return }
  shell(`<main class="apage">
    <div class="aside">${pic(reg?"card-flatlay":"poruwa-couple","(max-width:820px) 100vw, 52vw","",reg?"50% 50%":"50% 32%",false)}

      <span>${reg?"Save your events, keep your guest list in one place and order custom designs from our studio.":"Pick up where you left off with your events, guest links and designs."}</span></div></div>
    <div class="formside"><form class="aform" id="aform" novalidate>
      <div><span class="eyebrow">${reg?"Create account":"Log in"}</span><h1>${reg?"Join <em>Aradhanawa</em>":"Ayubowan"}</h1></div>
      <p class="sub">${reg?"Free forever for 5 guests. No card needed.":"Log in with your email and password."}</p>
      ${reg?`<div class="af"><label for="f-name">Full name</label><input id="f-name" name="fullname" autocomplete="name" placeholder="Tharushi Fernando"></div>`:""}
      <div class="af"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" placeholder="you@email.com"></div>
      ${reg?`<div class="af"><label for="f-phone">WhatsApp number</label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX"></div>`:""}
      <div class="af"><label for="f-pw">Password</label><div class="pw"><input id="f-pw" name="pw" type="password" autocomplete="${reg?"new-password":"current-password"}" placeholder="${reg?"At least 6 characters":""}"><button type="button" data-showpw>Show</button></div>${reg?`<div class="meter" aria-hidden="true"><i></i></div>`:""}</div>
      ${reg?`<label class="chk"><input type="checkbox" name="terms"> <span>I agree to the Terms and Privacy Policy.</span></label>`
           :`<div class="split"><label class="chk"><input type="checkbox" name="keep" checked> <span>Keep me logged in</span></label><button type="button" class="lk" data-forgot>Forgot password?</button></div>`}
      <p class="err" role="alert"></p>
      <button class="btn primary" type="submit">${reg?"Create account":"Log in"}</button>
      <p class="alt">${reg?`Already have an account? <a href="#login">Log in</a>`:`New to Aradhanawa? <a href="#register">Create an account</a>`}</p>
      ${reg?"":`<p class="hint">Admin demo login: <b>admin@aradhanawa.lk</b> / <b>admin123</b>. Change it before going live.</p>`}
    </form></div></main>`);
  const f=document.getElementById("aform"), err=f.querySelector(".err"), pw=f.querySelector("#f-pw");
  f.querySelector("[data-showpw]").onclick=e=>{ const s=pw.type==="password"; pw.type=s?"text":"password"; e.target.textContent=s?"Hide":"Show" };
  const fg=f.querySelector("[data-forgot]"); if(fg) fg.onclick=()=>modal(`<span class="eyebrow">Reset password</span><h3>Forgot your password?</h3><p>Message our studio on WhatsApp from the number on your account and we'll reset it for you.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Close</button><a class="btn wa" target="_blank" rel="noopener" href="${waLink(CONFIG.STUDIO_WA,"Hi Aradhanawa! Please help me reset my account password.")}">${I.wa} WhatsApp us</a></div>`);
  if(reg) pw.oninput=()=>{ const v=pw.value, sc=(v.length>=6)+(v.length>=10)+/[A-Z]/.test(v)+/\d/.test(v)+/[^A-Za-z0-9]/.test(v); const i=f.querySelector(".meter i"); i.style.width=(sc*20)+"%"; i.style.background=sc<2?"#B3261E":sc<4?"#C29A55":"#2F7A57" };
  f.onsubmit=async e=>{
    e.preventDefault(); err.textContent=""; f.querySelectorAll("[aria-invalid]").forEach(x=>x.removeAttribute("aria-invalid"));
    const v=k=>(f.elements[k]&&f.elements[k].value||"").trim(), bad=(k,m)=>{ err.textContent=m; const el=f.elements[k]; if(el&&el.focus){ el.setAttribute("aria-invalid","true"); el.focus() } };
    const email=v("email").toLowerCase(), users=DB.users();
    if(reg){
      if(v("fullname").length<2) return bad("fullname","Please enter your name.");
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return bad("email","Please enter a valid email.");
      if(v("phone") && intlPhone(v("phone")).length!==11) return bad("phone","WhatsApp number should look like 07X XXX XXXX.");
      if(pw.value.length<6) return bad("pw","Password needs at least 6 characters.");
      if(!f.elements.terms.checked) return bad("terms","Please accept the terms to continue.");
      if(users.some(u=>u.email===email)) return bad("email","An account with this email already exists. Try logging in.");
      users.push({id:"u"+Date.now().toString(36),name:v("fullname"),email,phone:v("phone"),pw:await hashPw(pw.value),role:"user",plan:"Free",created:new Date().toISOString()});
      DB.setUsers(users); store.set("session",email); toast("Account created. Welcome to Aradhanawa!");
      location.hash="#account";
    }else{
      const u=users.find(x=>x.email===email);
      if(!u||!u.pw||u.pw!==await hashPw(pw.value)) return bad("pw","Email or password is incorrect.");
      store.set("session",email); toast(`Welcome back, ${u.name.split(" ")[0]}`);
      const nx=store.get("next",""); store.set("next","");
      location.hash = nx || (u.role==="admin"?"#admin":"#account");
    }
  };
}

  });
  const sf=document.getElementById("sform");
  if(sf) sf.onsubmit=e=>{ e.preventDefault(); const c={}; for(const k of ["FREE_GUESTS","STUDIO_WA","PRICE_PLUS","PRICE_CUSTOM","MUSIC"]){ const v=sf.elements[k].value.trim(); if(k==="MUSIC"){ c.MUSIC=v; const a=document.getElementById("lxAudio"); if(a) a.remove(); continue } if(v) c[k]=k==="FREE_GUESTS"?Math.max(1,+v||5):k==="STUDIO_WA"?intlPhone(v):v } store.set("config",c); Object.assign(CONFIG,c); toast("Settings saved") };
}

/* ---------- router ---------- */
const PAGES = { login:()=>renderAuth("login"), register:()=>renderAuth("register"), account:renderAccount, admin:renderAdmin };
function route(){
  const h=location.hash||"";
  if(h.startsWith("#i=")){ try{ const p=JSON.parse(unb64(h.slice(3))); if(p&&p.e){ renderGuest(p); return } }catch(e){} }
  const [pg,sub]=h.slice(1).split("/");
  if(PAGES[pg]){ PAGES[pg](sub); return }
  if(!document.getElementById("editor")){ render(); const el=h.length>1&&document.getElementById(h.slice(1)); if(el) el.scrollIntoView(); else window.scrollTo(0,0) }
}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-order]"); if(o){ const [k,d]=o.dataset.order.split("|"); logOrder(k,d) }
  if(e.target.closest("[data-logout]")){ store.set("session",null); toast("Logged out"); if(/^#(admin|account)/.test(location.hash)) location.hash=""; else render() }
});

(function boot(){
  try{ Object.assign(CONFIG, store.get("config",{})) }catch(e){}
  lxCSS();
  seedDB().catch(()=>{}).finally(route);
})();
</script>
</body></html>
