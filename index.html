<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="description" content="Aradhanawa - Sri Lankan digital invitations for weddings, homecomings, birthdays and dana, sent on WhatsApp in Sinhala, Singlish or English."><meta name="theme-color" content="#FFF3E3"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Aradhanawa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans+Sinhala:wght@400..800&family=Noto+Serif+Sinhala:wght@500..900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&display=swap">
<style>
/* Layout: an atelier table in daylight. Jasmine-ivory paper, champagne-gold hairlines and corner marks, deep jade ink.
   A deliberate single light look (the user asked for light colours), so every colour is set explicitly here. */
:root{
  --paper:#FBF8F2; --surface:#FFFFFF; --sunk:#F4EFE6; --blush:#F6E9E2; --mist:#E9F0EB;
  --ink:#1D2A24; --muted:#66716B; --line:#E7DFD0; --line-2:#D9CDB6;
  --accent:#9C7534; --gold:#C29A55; --accent-ink:#FFFFFF; --brass:#9C7534; --leaf:#2F7A57; --jade:#2F6B57;
  --wa:#1F8A4C;
  --f-display:"Bodoni Moda","Noto Serif Sinhala",Georgia,serif;
  --f-body:"Hanken Grotesk","Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Pinyon Script","Bodoni Moda",cursive;
  --r:2px;
  --h-bg:#F7F1E6; --h-bg2:#FFFDF8; --h-ink:#1D2A24; --h-soft:#5D6A63; --h-gold:#9C7534;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--accent);letter-spacing:.2px}
.logo span{font-size:13px;color:var(--muted)}
nav.top{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.top::-webkit-scrollbar{display:none}
@media (max-width:600px){header.top .wrap{flex-wrap:nowrap;gap:10px}.logo span{display:none}nav.top a{padding:7px 9px;font-size:13.5px;white-space:nowrap}}
nav.top a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
nav.top a:hover{background:var(--sunk);color:var(--ink)}

.intro{padding-block:32px 8px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.intro .copy{display:grid;gap:6px;min-width:0}
.hero-img{margin:0;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--sunk);max-width:100%}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:820px){.intro{grid-template-columns:minmax(0,1fr);gap:26px}}
.intro h1{font-size:clamp(30px,4.4vw,46px);font-weight:800}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p{margin:0;color:var(--muted);max-width:62ch}

/* main grid */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:28px;padding-block:20px 40px;align-items:start}
@media (max-width:920px){.bench{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{font-size:22px;font-weight:700}
.panel .sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700}

/* event types */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.type{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:2px;transition:border-color .15s,background .15s}
.type:hover{border-color:var(--brass)}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.type b{font-weight:600;font-size:14.5px}
.type small{font-family:"Noto Sans Sinhala",var(--f-body);color:var(--muted);font-size:12px}

/* templates */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.tpls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tpl .sw img{width:100%;height:100%;object-fit:cover;display:block}
.tpl{min-width:0;grid-template-columns:minmax(0,1fr);position:relative;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--paper);cursor:pointer;text-align:left;display:grid;gap:8px}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl .sw{aspect-ratio:4/3;border-radius:6px;overflow:hidden;display:grid;place-items:center}
.tpl .sw svg{width:86%;height:auto}
.tpl .nm{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:600;align-items:center}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.free{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:var(--leaf)}
.pill.pro{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.tpl.locked .sw{filter:saturate(.75)}
.tpl.locked .lock{position:absolute;top:14px;right:14px;z-index:1;background:rgba(20,10,12,.72);color:#fff;border-radius:999px;font-size:11px;padding:3px 8px;font-weight:600}

/* form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.fld{display:grid;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;min-width:0}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.sample{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* whatsapp */
.wa-box{background:#E9DDD2;background:color-mix(in srgb,var(--leaf) 9%,var(--sunk));border-radius:12px;padding:16px}
.bubble{overflow-wrap:anywhere;background:var(--surface);border-radius:10px 10px 10px 2px;padding:12px 14px;white-space:pre-wrap;font-size:14px;max-height:360px;overflow:auto;border:1px solid var(--line);font-family:var(--f-body)}
.bubble b{font-weight:700}

/* guests */
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter .bar{display:flex;gap:3px}
.meter .bar i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.meter .bar i.on{background:var(--leaf)}
.gadd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;margin-bottom:12px}
@media (max-width:560px){.gadd{grid-template-columns:minmax(0,1fr)}}
.gadd input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;min-width:0}
.glist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.glist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.glist .who{min-width:0}
.glist .who b{display:block;font-weight:600}
.glist .who span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.glist .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:15px;height:15px}
.empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center}

/* stage (preview) */
.stage{position:sticky;top:16px;display:grid;gap:14px}
.table{background:var(--sunk);border-radius:16px;padding:22px;display:grid;place-items:center;border:1px solid var(--line)}
.stage .row{justify-content:center}

/* pricing */
section.band{padding-block:40px;border-top:1px solid var(--line)}
section.band > .wrap > h2{font-size:clamp(26px,3.4vw,36px);font-weight:800}
section.band > .wrap > p.lead{color:var(--muted);margin:6px 0 22px;max-width:62ch}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:22px;display:grid;gap:12px;align-content:start}
.plan.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.plan h3{font-size:22px}
.price{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted)}

/* prompts */
.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.prompts{grid-template-columns:minmax(0,1fr)}}
.prompt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:8px;min-width:0}
.prompt header{display:flex;justify-content:space-between;gap:10px;align-items:center}
.prompt h3{font-size:18px}
.prompt .gen{margin:0;border-radius:8px;overflow:hidden;aspect-ratio:16/9;background:var(--sunk)}
.prompt .gen img{width:100%;height:100%;object-fit:cover;display:block}
.prompt p{margin:0;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.prompt .use{font-size:12px;color:var(--muted)}
.prompt code{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

footer.foot{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,8,10,.6);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:22px;display:grid;gap:12px;border:1px solid var(--line)}
.modal h3{font-size:24px}
.modal p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}


/* ===== HERO (cinematic) ===== */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 78% 30%,var(--h-bg2) 0%,var(--h-bg) 62%);color:var(--h-ink);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:var(--pat) center/720px auto repeat;opacity:.10;z-index:-1}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:120px;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--h-bg) 70%,transparent));z-index:-1}
.hero .wm{position:absolute;left:-2vw;bottom:-4.5vw;font-family:"Noto Sans Sinhala",var(--f-display);font-weight:600;font-size:clamp(90px,19vw,260px);line-height:1;color:var(--h-gold);opacity:.07;z-index:-1;white-space:nowrap;pointer-events:none}
.hero .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:56px 72px}
@media (max-width:860px){.hero .in{grid-template-columns:minmax(0,1fr);padding-block:36px 48px;gap:40px}}
.hero .eyebrow{color:var(--h-gold)}
.hero h1{font-size:clamp(40px,6vw,76px);font-weight:800;line-height:1.02;letter-spacing:-.01em;margin-top:10px;color:var(--h-ink)}
.hero h1 em{font-style:normal;color:var(--h-gold);display:inline-block;position:relative}
.hero h1 em::after{content:"";position:absolute;left:2%;right:2%;bottom:.06em;height:.08em;background:linear-gradient(90deg,transparent,var(--h-gold),transparent);opacity:.7}
.hero p.lede{margin:18px 0 0;color:var(--h-soft);font-size:17px;max-width:46ch;line-height:1.6}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero .btn{border-color:color-mix(in srgb,var(--h-ink) 30%,transparent);background:transparent;color:var(--h-ink);padding:12px 20px;font-size:15px}
.hero .btn:hover{border-color:var(--h-ink)}
.hero .btn.gold{background:var(--h-gold);border-color:var(--h-gold);color:var(--h-bg);box-shadow:0 10px 30px -10px color-mix(in srgb,var(--h-gold) 70%,transparent)}
.hero .facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:12px 28px;margin-top:34px;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--h-gold) 25%,transparent)}
.hero .facts div{display:grid;gap:2px}
.hero .facts b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--h-ink);line-height:1}
.hero .facts span{font-size:12.5px;color:var(--h-soft);letter-spacing:.04em}
.hero .stagewrap{position:relative;display:grid;place-items:center;min-height:560px}
#heroPhone{width:330px;max-width:100%;position:relative;z-index:1}
.hero .glow{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--h-gold) 30%,transparent),transparent 65%);z-index:0}
.hero .backcard{position:absolute;width:230px;left:2%;top:10%;transform:rotate(-11deg);z-index:0;opacity:.95}
.hero .backcard .card{box-shadow:0 30px 50px -20px rgba(0,0,0,.6)}
.hero .phone{z-index:1;transform:perspective(1400px) rotateY(-9deg) rotateX(3deg) rotate(1.5deg);box-shadow:0 0 0 1px #4a3a3e,-30px 50px 80px -30px rgba(0,0,0,.75)}
.chip{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,#fff 92%,transparent);color:#2B1A1E;border-radius:14px;padding:10px 14px;font-size:13px;box-shadow:0 18px 40px -16px rgba(0,0,0,.55);max-width:240px}
.chip i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;font-size:16px}
.chip b{display:block;font-size:13.5px}
.chip small{color:#7B6A6C;font-size:12px}
.chip.c1{top:16%;right:-2%}.chip.c1 i{background:#E5F4EA;color:#1F8A4C}
.chip.c2{bottom:20%;left:-4%}.chip.c2 i{background:#FBEFD5;color:#A87A22}
.chip.c3{top:47%;right:-6%}.chip.c3 i{background:#FBE3E7;color:#8A1C2C}
@media (prefers-reduced-motion:no-preference){
  .chip{animation:float 6s ease-in-out infinite}.chip.c2{animation-delay:-2s}.chip.c3{animation-delay:-4s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
}
@media (max-width:860px){
  .hero .facts{gap:10px 18px}.hero .facts b{font-size:24px}.hero .facts span{font-size:11.5px}
  .hero .stagewrap{min-height:0;padding-block:10px 20px}
  .hero .phone{transform:none}
  .hero .backcard{width:150px;left:-6%;top:6%}
  .chip{padding:8px 10px;font-size:12px;max-width:200px}.chip i{width:26px;height:26px;font-size:13px}
  .chip.c1{right:-2%;top:8%}.chip.c2{left:-2%;bottom:24%}.chip.c3{display:none}
}
/* section heads */
.shead{display:grid;gap:8px;margin-bottom:26px;max-width:640px}
.shead h2{font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1.08}
.shead h2 em{font-style:normal;color:var(--accent)}
.shead p{margin:0;color:var(--muted);font-size:16px}
.shead.center{margin-inline:auto;text-align:center;justify-items:center}
/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:st}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border-top:2px solid var(--line);padding-top:16px;display:grid;gap:6px;counter-increment:st}
.step::before{content:counter(st,decimal-leading-zero);font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--accent);line-height:1}
.step:first-child{border-top-color:var(--accent)}
.step h3{font-size:21px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
/* designs gallery */
.dfilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dfilter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.dfilter button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drow{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(190px,46vw,236px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;scrollbar-width:thin}
.ditem{scroll-snap-align:start;display:grid;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.ditem .dphone{border-radius:28px;background:#141012;padding:7px;box-shadow:0 18px 36px -22px rgba(40,10,15,.6);transition:transform .25s}
.ditem:hover .dphone{transform:translateY(-4px)}
.ditem .dphone .card{border-radius:22px;max-width:none;box-shadow:none}
.ditem .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-inline:4px}
.ditem .meta b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.1}
.ditem .meta small{color:var(--muted);font-size:12.5px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:10px;align-content:start;min-width:0;overflow:hidden}
.tile h3{font-size:22px}.tile p{margin:0;color:var(--muted);font-size:14.5px}
.t-a{grid-column:span 4}.t-b{grid-column:span 2}.t-c{grid-column:span 2}.t-d{grid-column:span 2}.t-e{grid-column:span 2}
@media (max-width:900px){.bento{grid-template-columns:minmax(0,1fr)}.t-a,.t-b,.t-c,.t-d,.t-e{grid-column:auto}}
.inbox{display:grid;gap:8px;margin-top:6px}
.inbox .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.inbox .stats div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.inbox .stats b{font-family:var(--f-display);font-size:26px;display:block;line-height:1}
.inbox .stats small{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.inbox .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.inbox .r span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st.y{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:var(--leaf)}.st.n{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}.st.p{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.mini-cd{display:flex;gap:6px;margin-top:4px}
.mini-cd div{flex:1;background:var(--sunk);border-radius:10px;padding:8px 4px;text-align:center}
.mini-cd b{font-family:var(--f-display);font-size:24px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.mini-cd small{font-size:10.5px;color:var(--muted)}
.dear{font-family:var(--f-script);font-size:40px;color:var(--accent);line-height:1.1;margin-top:4px}
.langs{display:grid;gap:6px;margin-top:4px}
.langs span{background:var(--sunk);border-radius:12px 12px 12px 3px;padding:8px 12px;font-size:13.5px;justify-self:start}
.langs span:nth-child(2){font-family:"Noto Sans Sinhala",var(--f-body)}
.mapmini{border-radius:14px;overflow:hidden;background:var(--sunk);margin-top:4px}
.mapmini svg{display:block;width:100%;height:auto}
.example{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.editor-head{padding-top:44px}

/* ===== invitation site: what guests open ===== */
.site{background-color:var(--c-bg);color:var(--c-ink);position:relative;font-family:var(--f-body);
  background-image:radial-gradient(circle at 12% 6%,color-mix(in srgb,var(--c-gold) 10%,transparent) 0 110px,transparent 111px),radial-gradient(circle at 92% 38%,color-mix(in srgb,var(--c-gold) 7%,transparent) 0 90px,transparent 91px),radial-gradient(circle at 8% 78%,color-mix(in srgb,var(--c-gold) 7%,transparent) 0 80px,transparent 81px)}
.site .s-hero{padding:18px 16px 12px;display:grid;justify-items:center;gap:12px}
.site .s-hero .card{box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.site .s-hint{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--c-soft)}
.site .s-sec{padding:40px 22px;display:grid;gap:14px;justify-items:center;text-align:center;border-top:1px solid color-mix(in srgb,var(--c-gold) 22%,transparent)}
.site .s-eb{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--c-gold);font-weight:700}
.site .s-h{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--c-ink);line-height:1.15;margin:0}
.site.si .s-h,.site.si .s-p,.site.si .s-form,.site.si .s-cd small{font-family:"Noto Sans Sinhala",var(--f-body)}
.site .s-orn{width:110px;height:auto;display:block}
.site .s-p{margin:0;color:var(--c-soft);max-width:34ch;line-height:1.6;font-size:15px}
.site .s-date{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;width:100%;max-width:320px}
.site .s-date span{border-block:1px solid color-mix(in srgb,var(--c-gold) 60%,transparent);padding:6px 0;font-size:14px;color:var(--c-ink)}
.site .s-date b{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--c-gold);font-weight:800}
.site .s-year{font-family:var(--f-display);letter-spacing:.3em;font-size:18px;color:var(--c-gold)}
.site .s-cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:340px}
.site .s-cd div{border:1px solid color-mix(in srgb,var(--c-gold) 45%,transparent);background:color-mix(in srgb,var(--c-ink) 6%,transparent);border-radius:14px;padding:12px 2px;display:grid;gap:2px}
.site .s-cd b{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--c-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.site .s-cd small{font-size:10.5px;color:var(--c-soft);letter-spacing:.06em}
.site .s-evs{display:grid;gap:10px;width:100%;max-width:360px}
.site .s-ev{border:1px solid color-mix(in srgb,var(--c-gold) 40%,transparent);border-radius:16px;padding:16px;display:grid;gap:3px;background:color-mix(in srgb,var(--c-ink) 5%,transparent)}
.site .s-ev .t{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--c-gold);line-height:1.1}
.site .s-ev .n{font-weight:700;color:var(--c-ink)}
.site .s-ev .w{font-size:13.5px;color:var(--c-soft)}
.site .s-row{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid color-mix(in srgb,var(--c-gold) 40%,transparent);border-radius:16px;padding:12px 14px;width:100%;max-width:360px;color:var(--c-ink);text-decoration:none;background:color-mix(in srgb,var(--c-ink) 4%,transparent)}
.site .s-row i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-gold);color:var(--c-bg);flex:none}
.site .s-row i svg{width:18px;height:18px}
.site .s-row span{min-width:0;flex:1}
.site .s-row b{display:block;font-size:15px}
.site .s-row small{color:var(--c-soft);font-size:12.5px}
.site .s-gal{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:120px;gap:8px;width:100%;max-width:360px}
.site .s-gal figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c-gold) 40%,transparent)}
.site .s-gal figure:nth-child(3n+1){border-radius:999px 999px 12px 12px;grid-row:span 2}
.site .s-gal img{width:100%;height:100%;object-fit:cover;display:block}
.site .s-map{width:100%;max-width:360px;border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c-gold) 40%,transparent)}
.site .s-map svg{display:block;width:100%;height:auto}
.site .s-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c-gold);color:var(--c-bg);border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;width:100%;max-width:360px;font-family:inherit}
.site .s-btn svg{width:18px;height:18px}
.site .s-btn.off{opacity:.45;pointer-events:none}
.site .s-form{width:100%;max-width:360px;display:grid;gap:16px;text-align:left;background:color-mix(in srgb,var(--c-ink) 6%,transparent);border:1px solid color-mix(in srgb,var(--c-gold) 35%,transparent);border-radius:150px 150px 18px 18px;padding:54px 18px 20px}
.site .s-form label,.site .s-form .lbl{font-size:13px;font-weight:600;color:var(--c-ink);display:grid;gap:6px}
.site .s-form input,.site .s-form textarea{width:100%;border:1px solid color-mix(in srgb,var(--c-gold) 45%,transparent);background:transparent;color:var(--c-ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;font-weight:400}
.site .s-form input::placeholder,.site .s-form textarea::placeholder{color:var(--c-soft);opacity:.75}
.site .s-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.site .s-choice button{border:1px solid color-mix(in srgb,var(--c-gold) 45%,transparent);background:transparent;color:var(--c-ink);border-radius:12px;padding:12px 8px;font:inherit;font-size:14px;cursor:pointer}
.site .s-choice button[aria-pressed="true"]{background:var(--c-gold);color:var(--c-bg);border-color:var(--c-gold);font-weight:700}
.site .s-step{display:flex;align-items:center;justify-content:center;gap:22px}
.site .s-step button{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c-gold) 55%,transparent);background:transparent;color:var(--c-ink);font-size:20px;cursor:pointer;font-family:inherit}
.site .s-step output{font-family:var(--f-display);font-size:34px;font-weight:800;min-width:2ch;text-align:center;color:var(--c-gold)}
.site .s-foot{padding:26px 22px 100px;text-align:center;font-size:12.5px;color:var(--c-soft)}
.site .s-foot a{color:var(--c-gold)}
.site .snav{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:-80px auto 18px;width:max-content;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--c-ink);box-shadow:0 10px 30px -10px rgba(0,0,0,.55);z-index:5}
.site .snav button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--c-bg);display:grid;place-items:center;cursor:pointer}
.site .snav button svg{width:19px;height:19px}
.site .snav button[aria-current="true"]{background:var(--c-gold)}
.site .snav .s-mus{border-left:1px solid color-mix(in srgb,var(--c-bg) 30%,transparent);border-radius:0 50% 50% 0}
.site .s-mus .m-off,.site .s-mus.on .m-on{display:block}.site .s-mus .m-on,.site .s-mus.on .m-off{display:none}
.site .s-mus.on{color:var(--c-gold)}
/* phone frame */
.phone{position:relative;width:min(330px,100%);height:min(680px,calc(100vh - 140px));min-height:520px;border-radius:46px;background:#141012;padding:11px;box-shadow:0 0 0 1px #3a3034,0 30px 60px -25px rgba(40,10,15,.6);margin-inline:auto}
.phone .screen{height:100%;border-radius:36px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.phone .screen::-webkit-scrollbar{display:none}
.phone .island{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:92px;height:25px;border-radius:20px;background:#141012;z-index:6}
.phone .site .s-hero{padding-top:46px}
.phone .site .snav{bottom:14px}
.modal.phonebox{background:transparent;border:0;padding:0;max-width:380px;justify-items:center}
.modal.phonebox .btn{background:var(--surface)}
/* compare receipt */
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:36px;align-items:start}
@media (max-width:860px){.compare{grid-template-columns:minmax(0,1fr)}}
.compare .hero-img{aspect-ratio:16/10;margin-top:18px}
.receipt{--paper-c:#FFFDF7;--paper-ink:#2B1A1E;--paper-mute:#7B6A6C;--paper-red:#A3152F;background:var(--paper-c);color:var(--paper-ink);padding:26px 22px 40px;font-variant-numeric:tabular-nums;box-shadow:0 22px 40px -26px rgba(40,10,15,.45);position:relative;border-radius:4px 4px 0 0;
  -webkit-mask:radial-gradient(circle 9px at 50% 100%,transparent 96%,#000) 0 0/22px 100% repeat-x;mask:radial-gradient(circle 9px at 50% 100%,transparent 96%,#000) 0 0/22px 100% repeat-x}
.receipt h3{font-family:var(--f-body);font-size:13px;letter-spacing:.32em;text-transform:uppercase;text-align:center;font-weight:600}
.receipt .sub{text-align:center;font-size:12.5px;color:var(--paper-mute);margin:4px 0 0}
.receipt dl{margin:16px 0 0;padding:14px 0 0;border-top:1px dashed #D8CCC4;display:grid;gap:9px}
.receipt dl div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.receipt dl dd{margin:0;white-space:nowrap}
.receipt .tot{border-top:1px dashed #D8CCC4;padding-top:12px;font-weight:700}
.receipt .tot dd s{color:var(--paper-red);text-decoration-thickness:2px}
.receipt .na dt,.receipt .na dd{color:var(--paper-mute)}
.receipt hr{border:0;border-top:2px solid var(--paper-ink);margin:18px 0}
.receipt .ours{text-align:center;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--paper-red);font-weight:700}
.receipt .save{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:14px}
.receipt .stamp{border:2px solid var(--paper-red);color:var(--paper-red);border-radius:10px;padding:5px 12px;transform:rotate(-8deg);font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase;line-height:1.2;text-align:center}
.receipt .stamp b{display:block;font-size:17px;letter-spacing:.02em}
.receipt .keep{text-align:right;color:var(--paper-red);font-weight:700;font-size:14px}
.receipt .keep b{display:block;font-family:var(--f-display);font-size:30px;color:var(--paper-ink)}
.receipt .fine{text-align:center;font-size:11.5px;color:var(--paper-mute);margin:18px 0 0}
/* faq */
.faq{display:grid;gap:10px;max-width:760px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 18px}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;font-weight:600;font-size:15.5px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 16px;color:var(--muted)}
/* photos */
.photos{margin-top:18px;display:grid;gap:8px}
.photos .hint{font-size:12.5px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.pgrid .ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(20,10,12,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.pgrid .padd{aspect-ratio:1;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;padding:6px}
.pgrid .padd:hover{border-color:var(--accent);color:var(--accent)}
/* mobile sticky bar */
.ctabar{display:none}
@media (max-width:720px){
  .ctabar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:center;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 24px -18px rgba(0,0,0,.3)}
  body.has-bar{padding-bottom:78px}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
.ctabar .p{display:grid;line-height:1.15;margin-right:auto;min-width:0}
.ctabar .p small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctabar .p b{font-family:var(--f-display);font-size:19px}
.ctabar .wa-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--wa);flex:none}
.ctabar .wa-ic svg{width:22px;height:22px}
/* guest page */
.gwrap{min-height:100vh;background:var(--c-bg)}
.gwrap .site{max-width:480px;margin:0 auto;min-height:100vh}
/* guest link: full-page card */
.gwrap .site:not(.lotus) > .s-hero{min-height:100svh;padding:0;gap:0;position:relative;align-content:stretch}
.gwrap .site:not(.lotus) > .s-hero .card{max-width:none;width:100%;aspect-ratio:auto;min-height:100svh;border-radius:0;box-shadow:none}
.gwrap .site:not(.lotus) > .s-hero .s-hint{position:absolute;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--c-soft);animation:ghint 2s ease-in-out infinite;z-index:2;pointer-events:none}
@keyframes ghint{50%{transform:translateY(5px);opacity:.6}}
@media (min-width:600px){.gwrap{padding:0}.gwrap .site:not(.lotus) > .s-hero .card{box-shadow:0 0 60px -10px rgba(0,0,0,.35)}}
.gwrap.in .s-hero .card{animation:gcardin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gcardin{from{opacity:0;transform:scale(.94) translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* guest link: envelope loader */
.gload{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:26px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--g-bg) 80%,#fff),var(--g-bg));color:var(--g-ink);font-family:"Cormorant Garamond","Noto Serif Sinhala",Georgia,serif;transition:opacity .7s ease,transform .9s ease;cursor:pointer}
.gload.out{opacity:0;transform:scale(1.15);pointer-events:none}
.gl-env{position:relative;width:min(70vw,300px);aspect-ratio:1.5;perspective:900px;animation:glrise .8s cubic-bezier(.2,.8,.2,1) both}
.gl-back{position:absolute;inset:0;border-radius:6px;background:color-mix(in srgb,var(--g-gold) 55%,#000 10%);box-shadow:0 30px 50px -24px rgba(0,0,0,.6)}
.gl-letter{position:absolute;left:7%;right:7%;top:8%;height:88%;border-radius:4px;background:#FFFDF7;border:1px solid var(--g-gold);display:grid;place-items:center;align-content:center;gap:4px;color:#5A4320;text-align:center;animation:glletter 1s cubic-bezier(.3,.8,.3,1) 1.5s both}
.gl-letter b{font:italic 600 clamp(18px,5vw,24px)/1.1 "Cormorant Garamond",serif}
.gl-letter small{font:600 9px/1 "Inter Tight",sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9A6E1C}
.gl-front{position:absolute;inset:0;border-radius:6px;background:var(--g-gold);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.gl-front::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 45%),linear-gradient(20deg,rgba(0,0,0,.12),transparent 50%)}
.gl-flap{position:absolute;left:0;right:0;top:0;height:60%;background:color-mix(in srgb,var(--g-gold) 88%,#fff);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:3;animation:glflap .8s cubic-bezier(.5,0,.3,1) .9s both}
.gl-seal{position:absolute;left:50%;top:60%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:4;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--g-bg) 60%,#fff 20%),var(--g-bg));color:var(--g-gold);font:italic 700 18px/1 "Cormorant Garamond",serif;box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 3px color-mix(in srgb,var(--g-gold) 60%,transparent);animation:glseal .5s ease .55s both}
.gl-txt{text-align:center;display:grid;gap:6px;animation:glfade .8s ease .4s both}
.gl-txt b{font:italic 600 clamp(22px,6vw,30px)/1.15 "Cormorant Garamond","Noto Serif Sinhala",serif;color:var(--g-ink)}
.gl-txt small{font:500 11px/1 "Inter Tight",sans-serif;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
.gl-bar{width:120px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--g-gold) 30%,transparent);overflow:hidden}
.gl-bar i{display:block;height:100%;width:100%;background:var(--g-gold);transform-origin:0 50%;animation:glbar 2.6s linear both}
@keyframes glrise{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes glseal{to{transform:scale(1.25);opacity:0}}
@keyframes glflap{to{transform:rotateX(180deg);z-index:0}}
@keyframes glletter{to{transform:translateY(-46%);z-index:3}}
@keyframes glfade{from{opacity:0;transform:translateY(8px)}}
@keyframes glbar{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.gload *{animation-duration:.01s!important;animation-delay:0s!important}}
.guest{min-height:100%;display:grid;place-items:center;padding-block:28px;gap:18px}
.guest .rsvp{display:grid;gap:10px;width:100%;max-width:380px}
.guest .rsvp .row{justify-content:center}
.guest .made{font-size:12.5px;color:var(--muted);text-align:center}

/* ============ INVITATION CARD ============ */
.card{--c-bg:#5E1224;--c-ink:#F8EBD6;--c-gold:#D4A84A;--c-soft:#E9C9A0;
  width:100%;max-width:380px;aspect-ratio:5/7.2;position:relative;border-radius:6px;overflow:hidden;
  background:var(--c-bg);color:var(--c-ink);box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 40px -18px rgba(40,10,15,.45);
  display:grid;grid-template-rows:auto 1fr;text-align:center;container-type:inline-size}
.card .frame{position:absolute;inset:10px;border:1px solid var(--c-gold);border-radius:3px;pointer-events:none;opacity:.85}
.card .frame::after{content:"";position:absolute;inset:4px;border:1px solid var(--c-gold);opacity:.45;border-radius:2px}
.card .corner{position:absolute;width:42px;height:42px;pointer-events:none}
.card .corner.tl{top:6px;left:6px}.card .corner.tr{top:6px;right:6px;transform:scaleX(-1)}
.card .corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.card .corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}
.card .art{padding:26px 26px 0;display:grid;place-items:center}
.card .art svg{width:100%;height:auto;max-height:38cqw;display:block}
.card .txt{padding:2px 30px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8cqw}
.card .seal{font-family:"Noto Sans Sinhala",var(--f-display);font-size:3.3cqw;letter-spacing:.14em;color:var(--c-gold);text-transform:uppercase}
.card .dear{font-family:var(--f-display);font-size:4.2cqw;color:var(--c-soft);font-style:italic}
.card .eb{font-size:3.1cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--c-soft);font-weight:600;line-height:1.35}
.card .names{font-family:var(--f-script);font-size:10.4cqw;line-height:1.05;color:var(--c-ink);font-weight:400}
.card .names .amp{display:block;font-family:var(--f-display);font-size:5cqw;color:var(--c-gold);margin:.5cqw 0}
.card .big{font-family:var(--f-display);font-weight:800;font-size:9.6cqw;line-height:1.02;color:var(--c-ink)}
.card .age{font-family:var(--f-display);font-weight:800;font-size:20cqw;line-height:.9;color:var(--c-gold)}
.card .line{font-family:var(--f-display);font-size:4.4cqw;line-height:1.3;color:var(--c-soft);max-width:30ch}
.card .rule{width:30%;height:1px;background:var(--c-gold);opacity:.7;margin:.8cqw 0}
.card .dets{display:grid;gap:1cqw;font-size:3.6cqw;line-height:1.35}
.card .dets b{font-weight:700;color:var(--c-ink)}
.card .dets .k{font-size:2.7cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--c-gold);font-weight:700;display:block}
.card .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:2cqw 5cqw}
.card .cd{font-size:3cqw;color:var(--c-gold);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.card .brand{position:absolute;bottom:13px;left:0;right:0;font-size:2.4cqw;letter-spacing:.14em;color:var(--c-soft);opacity:.65}
.card.si .eb,.card.si .line,.card.si .dets{font-family:"Noto Sans Sinhala",var(--f-display);letter-spacing:0}
.card.si .eb{text-transform:none;font-size:3.4cqw}

/* photo templates */
.card.photo-top .art{padding:0;position:relative;aspect-ratio:2/1;display:block;overflow:hidden}
.card.photo-top .art img{width:100%;height:100%;object-fit:cover;display:block}
.card.photo-top .art::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(to bottom,transparent,var(--c-bg))}
.card.photo-top{grid-template-rows:auto 1fr}
.card.photo-top .txt{padding-top:0;gap:1.5cqw}
.card.photo-bg .art{position:absolute;inset:0;padding:0;display:block}
.card.photo-bg .art img{width:100%;height:100%;object-fit:cover;display:block}
.card.photo-bg .art::after{content:"";position:absolute;inset:0;background:var(--c-veil)}
.card.photo-bg .txt{position:relative;grid-row:1/-1;justify-content:var(--c-justify,center)}
.card .ribbon{position:absolute;top:18px;left:-34px;transform:rotate(-45deg);background:var(--c-gold);color:var(--c-bg);font-size:2.5cqw;font-weight:800;letter-spacing:.1em;padding:3px 40px;z-index:2;text-transform:uppercase}
.stage .pnote{font-size:13px;color:var(--muted);text-align:center;margin:0}
/* palettes per template */
.t-wedding{--c-bg:#FBF6EC;--c-ink:#4A1420;--c-gold:#B08A45;--c-soft:#7A5A4A}
.t-homecoming{--c-bg:#F0F5EF;--c-ink:#1F3B33;--c-gold:#B07F3E;--c-soft:#4F6A60}
.t-birthday{--c-bg:#FBEFC9;--c-ink:#5A1A16;--c-gold:#D9573A;--c-soft:#8A4A2B}
.t-party{--c-bg:#16193F;--c-ink:#FFFFFF;--c-gold:#F6C64F;--c-soft:#BFC4F2}
.t-dana{--c-bg:#FCF8EF;--c-ink:#3A2410;--c-gold:#C7701D;--c-soft:#7C5A36}
.t-other{--c-bg:#F7F3EA;--c-ink:#1D3A31;--c-gold:#A9864A;--c-soft:#5E6E66}
.t-dana .names,.t-birthday .names{color:var(--c-ink)}

@media (prefers-reduced-motion:no-preference){
  .card .flame{transform-origin:50% 100%;animation:fl 1.6s ease-in-out infinite alternate}
  @keyframes fl{from{transform:scale(1,1)}to{transform:scale(.92,1.08)}}
  .card .sway{transform-box:fill-box;transform-origin:50% 0;animation:sw 3.2s ease-in-out infinite alternate}
  @keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
}

/* ================= REDESIGN: light atelier ================= */
body{font-size:15.5px;letter-spacing:.005em}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eyebrow{color:var(--accent);letter-spacing:.24em;font-size:11px;font-weight:600}
/* header */
header.top{background:color-mix(in srgb,var(--paper) 92%,transparent);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--paper)}
.logo b{font-family:"Noto Serif Sinhala",var(--f-display);font-weight:700;color:var(--ink);font-size:24px}
.logo span{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:14px}
nav.top a{border-radius:0;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:8px 12px}
nav.top a:hover{background:none;color:var(--ink);box-shadow:inset 0 -1px 0 var(--gold)}
/* buttons */
.btn{border-radius:var(--r);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;padding:13px 22px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--jade);border-color:var(--jade)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:9px 14px;font-size:11px}
.iconbtn{border-radius:var(--r);border-color:var(--line)}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
/* framed boxes: hairline + champagne corner marks */
.panel,.plan,.tile,.prompt,.table,.faq details{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative;box-shadow:0 1px 0 rgba(29,42,36,.02),0 20px 40px -32px rgba(29,42,36,.25)}
.panel::before,.panel::after,.plan::before,.plan::after,.tile::before,.tile::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--gold);pointer-events:none}
.panel::before,.plan::before,.tile::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after,.plan::after,.tile::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel{padding:28px}
.panel h2{font-size:26px}
.panel .sub{font-size:14px}
.phead{margin-bottom:20px}
/* event types */
.type{border-radius:var(--r);background:var(--paper);border-color:var(--line);padding:14px 14px 12px;position:relative}
.type b{font-family:var(--f-display);font-size:18px;font-weight:500}
.type small{font-family:"Noto Serif Sinhala",var(--f-body)}
.type:hover{border-color:var(--gold)}
.type[aria-pressed="true"]{background:var(--surface);border-color:var(--ink);box-shadow:none}
.type[aria-pressed="true"]::after{content:"";position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
/* templates */
.tpl{border-radius:var(--r);background:var(--paper);padding:6px}
.tpl .sw{border-radius:0}
.tpl[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tpl .nm{font-family:var(--f-display);font-size:15px;font-weight:500;padding:2px 4px 4px}
.tpl.locked .lock{border-radius:var(--r);background:rgba(29,42,36,.78);letter-spacing:.04em}
.pill{border-radius:var(--r);letter-spacing:.14em;font-size:10px;padding:3px 7px}
.pill.free{background:var(--mist);color:var(--jade)}
.pill.pro{background:#F5ECDC;color:var(--accent)}
/* inputs: editorial underline */
.fld label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld textarea,.fld select,.gadd input{border:0;border-bottom:1px solid var(--line-2);border-radius:0;background:transparent;padding:10px 2px;font-size:16px;color:var(--ink)}
.fld input:focus,.fld textarea:focus,.gadd input:focus{box-shadow:none;border-bottom-color:var(--gold);outline:none}
.sample{border-radius:var(--r);background:var(--blush);color:#6B4F45}
/* segmented */
.seg{border-radius:var(--r);background:var(--sunk);padding:3px}
.seg button{border-radius:var(--r);letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
/* whatsapp box */
.wa-box{background:#EEE8DC;border-radius:var(--r);background-image:radial-gradient(rgba(29,42,36,.05) 1px,transparent 1px);background-size:14px 14px}
.bubble{border-radius:2px 14px 14px 14px;border:0;box-shadow:0 1px 1px rgba(0,0,0,.06)}
/* guests */
.glist li{border-radius:var(--r);border-color:var(--line)}
.glist .who b{font-family:var(--f-display);font-size:17px;font-weight:500}
.meter .bar i{border-radius:0;height:4px}
.meter .bar i.on{background:var(--gold)}
.empty{border-radius:var(--r)}
/* stage */
.table{background:linear-gradient(180deg,var(--sunk),var(--paper));padding:26px}
/* section heads */
.shead h2{font-weight:500;font-size:clamp(32px,4.4vw,52px);line-height:1.04}
.shead h2 em,.hero h1 em{font-style:italic;color:var(--accent)}
.shead p{font-size:16.5px}
section.band{border-top:1px solid var(--line);padding-block:72px}
@media (max-width:720px){section.band{padding-block:52px}}
/* hero: light */
.hero{background:radial-gradient(70% 90% at 82% 30%,var(--mist) 0%,transparent 60%),radial-gradient(60% 70% at 8% 100%,var(--blush) 0%,transparent 70%),var(--h-bg);color:var(--h-ink);border-bottom:1px solid var(--line)}
.hero::before{opacity:.05}
.hero::after{display:none}
.hero .wm{color:var(--gold);opacity:.12;font-family:"Noto Serif Sinhala",var(--f-display);font-weight:500}
.hero h1{font-weight:500;font-size:clamp(42px,5vw,72px);line-height:1;color:var(--h-ink)}
.hero h1 em::after{display:none}
.hero p.lede{color:var(--h-soft)}
.hero .btn{border-color:var(--line-2);color:var(--ink);background:var(--surface)}
.hero .btn:hover{border-color:var(--ink)}
.hero .btn.gold{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 14px 30px -14px rgba(29,42,36,.5)}
.hero .facts{border-top-color:var(--line-2)}
.hero .facts b{font-weight:500;color:var(--ink)}
.hero .facts span{color:var(--muted)}
.hero .glow{background:radial-gradient(circle,rgba(194,154,85,.28),transparent 65%)}
.hero .phone{box-shadow:0 0 0 1px #2a2a2a,-30px 50px 80px -34px rgba(29,42,36,.55)}
.chip{border-radius:var(--r);background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(29,42,36,.35)}
.chip small{color:var(--muted)}
.chip i{border-radius:0}
/* steps */
.step{border-top:1px solid var(--line-2)}
.step:first-child{border-top-color:var(--gold)}
.step::before{font-weight:400;font-style:italic;color:var(--gold);font-size:44px}
.step h3{font-weight:500;font-size:24px}
/* designs */
.dfilter button{border-radius:var(--r);text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:9px 14px}
.dfilter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ditem .dphone{border-radius:30px}
.ditem .meta b{font-weight:500}
/* bento */
.tile{padding:26px}
.tile h3{font-weight:500;font-size:24px}
.inbox .stats div,.mini-cd div,.langs span,.mapmini{border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.inbox .stats b,.mini-cd b{font-weight:500}
.st{border-radius:var(--r);letter-spacing:.06em}
.st.y{background:var(--mist);color:var(--jade)}.st.n{background:var(--blush);color:#A0453A}.st.p{background:#F5ECDC;color:var(--accent)}
.dear{color:var(--accent)}
.langs span{border-radius:2px 12px 12px 12px}
/* compare + pricing */
.receipt{box-shadow:0 30px 50px -34px rgba(29,42,36,.45);outline:1px solid var(--line)}
.plan{padding:28px}
.plan h3{font-weight:500;font-size:26px}
.plan.hl{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--gold),0 24px 50px -30px rgba(29,42,36,.35)}
.price{font-weight:500}
.hero-img{border-radius:var(--r)}
/* faq */
.faq{gap:0;border-top:1px solid var(--line-2)}
.faq details{border:0;border-bottom:1px solid var(--line-2);border-radius:0;background:transparent;box-shadow:none;padding:2px 0}
.faq summary{font-family:var(--f-display);font-weight:500;font-size:20px;padding:20px 0}
.faq summary::after{border-radius:0;background:transparent;border:1px solid var(--line-2);color:var(--accent)}
/* prompts */
.prompt{padding:18px}
.prompt h3{font-weight:500}
.prompt .gen{border-radius:0}
/* photos */
.pgrid .ph,.pgrid .padd{border-radius:var(--r)}
/* modal, toast, sticky bar */
.modal{border-radius:var(--r)}
.toast{border-radius:var(--r);background:var(--ink);color:var(--paper);letter-spacing:.04em}
.ctabar{background:color-mix(in srgb,var(--paper) 96%,transparent)}
.ctabar .p b{font-weight:500}
.ctabar .wa-ic{border-radius:var(--r)}
footer.foot{font-family:var(--f-display);font-style:italic}
/* cards keep their own palettes; just tune type weight for Bodoni */
.card .big{font-weight:600}
.card .age{font-weight:600}
.site .s-h{font-weight:500}
/* ================= BOLD TYPE ================= */
:root{--f-display:"Playfair Display","Noto Serif Sinhala",Georgia,serif;--f-body:"Plus Jakarta Sans","Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",sans-serif}
body{font-weight:500}
h1,h2,h3{font-weight:800;letter-spacing:-.015em}
.hero h1{font-weight:900;font-size:clamp(44px,5.6vw,80px);line-height:.98;letter-spacing:-.025em}
.hero h1 em,.shead h2 em{font-weight:800}
.shead h2{font-weight:800}
.step h3,.tile h3,.plan h3,.type b,.tpl .nm,.glist .who b,.ditem .meta b,.prompt h3,.faq summary{font-weight:700}
.price,.hero .facts b,.inbox .stats b,.mini-cd b,.ctabar .p b{font-weight:800}
.step::before{font-weight:700}
.btn{font-weight:700;letter-spacing:.1em}
nav.top a{font-weight:600}
.eyebrow{font-weight:700}
.logo b{font-weight:800}
.panel h2{font-weight:800}
.card .big,.card .age{font-weight:800}
.site .s-h{font-weight:800}

/* ================= NEW TEMPLATE LAYOUTS ================= */
.card.L-arch .art{padding:8cqw 0 0;display:grid;place-items:center}
.card.L-arch .art img{width:38cqw;aspect-ratio:1/1.05;object-fit:cover;border-radius:999px 999px 0 0;outline:1px solid var(--c-gold);outline-offset:1.4cqw;display:block}
.card.L-arch .txt{padding-top:3.5cqw;gap:1.2cqw}
.card.L-arch .names{font-size:8.4cqw}
.card.L-panel .art{position:absolute;inset:0;padding:0;display:block}
.card.L-panel .art img{width:100%;height:100%;object-fit:cover;display:block}
.card.L-panel .frame,.card.L-panel .corner{display:none}
.card.L-panel .txt{position:relative;grid-row:1/-1;margin:11cqw 8cqw 13cqw;padding:6cqw 5cqw;background:color-mix(in srgb,var(--c-bg) 93%,transparent);outline:1px solid var(--c-gold);outline-offset:-2.2cqw;gap:1.4cqw}

/* ================= HEADER AUTH ================= */
.auth{display:flex;align-items:center;gap:6px;flex:none}
.auth .lnk{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:9px 10px;background:none;border:0;cursor:pointer}
.auth .lnk:hover{color:var(--accent)}
.auth .btn{padding:10px 16px}
@media (max-width:760px){header.top .wrap{flex-wrap:wrap;row-gap:2px;padding-block:10px 4px}.auth{margin-left:auto}nav.top{order:3;width:calc(100% + 16px);margin:0 -8px;max-width:none}nav.top a{padding:8px 10px;font-size:12px}}

/* ================= AUTH PAGES ================= */
.apage{min-height:calc(100vh - 66px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--paper)}
.apage .aside{position:relative;overflow:hidden;background:#2A0D14;color:#FFF7EA;display:flex;align-items:flex-end;padding:clamp(24px,4vw,56px)}
.apage .aside img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.apage .aside::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(28,10,14,.9),rgba(28,10,14,.15) 65%)}
.apage .aside .q{position:relative;z-index:1;max-width:32ch;display:grid;gap:10px}
.apage .aside .q b{font-family:var(--f-display);font-size:clamp(28px,3.2vw,46px);font-weight:800;line-height:1.04;letter-spacing:-.02em}
.apage .aside .q span{opacity:.88;font-size:15px}
.apage .aside .q .eyebrow{color:#F0CF8E}
.apage .formside{display:grid;place-items:center;padding:clamp(28px,5vw,64px) 16px}
.aform{width:100%;max-width:410px;display:grid;gap:16px}
.aform h1{font-size:clamp(36px,4vw,50px);margin-top:6px}
.aform h1 em{font-style:italic;color:var(--accent)}
.aform .sub{color:var(--muted);margin:-6px 0 4px}
.af{display:grid;gap:6px}
.af label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.af input{width:100%;border:1px solid var(--line-2);background:var(--surface);padding:13px 14px;border-radius:var(--r);font-size:15px}
.af input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 28%,transparent)}
.af input[aria-invalid="true"]{border-color:#B3261E}
.af .pw{position:relative}
.af .pw input{padding-right:70px}
.af .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;padding:8px}
.aform .err{color:#B3261E;font-size:13.5px;font-weight:600;margin:0;min-height:1.2em}
.aform .btn.primary{width:100%;padding:15px}
.aform .alt{text-align:center;color:var(--muted);font-size:14px;margin:0}
.aform .alt a,.aform .lk{font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer;font-size:13.5px;padding:0}
.aform .hint{font-size:12.5px;color:var(--muted);background:var(--sunk);padding:10px 12px;border-left:2px solid var(--gold);margin:0}
.aform .chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);cursor:pointer}
.aform .chk input{accent-color:var(--jade);margin-top:3px}
.aform .split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{height:4px;background:var(--line);overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;width:0;background:#B3261E;transition:width .2s,background .2s}
@media (max-width:820px){.apage{grid-template-columns:minmax(0,1fr)}.apage .aside{min-height:190px}.apage .aside .q span:last-child{display:none}}

/* ================= ACCOUNT + ADMIN ================= */
.adm{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 66px);background:var(--paper)}
.adm .side{border-right:1px solid var(--line);background:var(--surface);padding:24px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}
.adm .side .who{padding:0 12px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.adm .side .who b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800}
.adm .side .who small{color:var(--muted);font-size:12.5px}
.adm .side a{display:flex;gap:12px;align-items:center;padding:11px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-left:2px solid transparent}
.adm .side a svg{width:18px;height:18px;flex:none}
.adm .side a:hover{color:var(--ink)}
.adm .side a[aria-current="page"]{color:var(--ink);background:var(--sunk);border-left-color:var(--gold)}
.adm .side .sp{flex:1}
.adm .main{padding:32px clamp(16px,3vw,40px) 64px;min-width:0;display:grid;gap:22px;align-content:start}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.mh h1{font-size:clamp(32px,3.6vw,46px)}
.mh p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;gap:4px;position:relative}
.kpi::before{content:"";position:absolute;left:0;top:0;width:28px;height:2px;background:var(--gold)}
.kpi small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);padding:20px;min-width:0}
.box h2{font-size:21px;margin-bottom:12px}
.box .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.box .bh h2{margin:0}
.tblwrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td b{font-weight:700}
.tbl td small{display:block;color:var(--muted);font-size:12.5px}
.tbl td.empty{text-align:center;color:var(--muted);padding:28px}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.tbl select{border:1px solid var(--line-2);background:var(--surface);padding:7px 8px;border-radius:var(--r);font-size:13px;font-weight:600}
.badge{display:inline-block;padding:3px 9px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ok{background:#E2F1E7;color:#1E6A42}.badge.warn{background:#FBEFD7;color:#865610}.badge.new{background:#F7E3E1;color:#9A2B2B}.badge.gold{background:#F3E8D2;color:#7E5C22}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbar input,.tbar select{border:1px solid var(--line-2);padding:10px 12px;background:var(--surface);border-radius:var(--r);font-size:14px}
.tbar input{min-width:0;flex:1 1 220px}
.tsec h2{font-size:22px;margin:6px 0 12px;display:flex;gap:10px;align-items:baseline}
.tsec h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.titem{background:var(--surface);border:1px solid var(--line);padding:10px;display:grid;gap:10px;align-content:start}
.titem .card{max-width:none;box-shadow:none}
.titem[data-off="1"] .card{opacity:.35;filter:grayscale(.6)}
.titem .trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.titem .trow b{font-family:var(--f-display);font-size:15.5px;font-weight:700;line-height:1.15}
.titem .trow small{display:block;color:var(--muted);font-size:12px}
.sw-t{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw-t:checked{background:var(--leaf)}.sw-t:checked::after{transform:translateX(17px)}
.sw-t:disabled{opacity:.5;cursor:not-allowed}
.sform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sform .af small{color:var(--muted);font-size:12.5px}
.danger{border-color:#EBC9C4}
.danger h2{color:#9A2B2B}
.acct .wrap{padding-block:36px 64px;display:grid;gap:22px}
@media (max-width:900px){.adm{grid-template-columns:minmax(0,1fr)}.adm .side{position:sticky;top:96px;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}.adm .side .who,.adm .side .sp{display:none}.adm .side a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:10px 12px}.adm .side a[aria-current="page"]{border-bottom-color:var(--gold);background:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.sform{grid-template-columns:minmax(0,1fr)}.adm .main{padding-top:22px}}
@media (max-width:420px){.kpi b{font-size:28px}.tgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
/* ================= LOTUS MANDALA THEME ================= */
.site.lotus{--lx-wine:var(--c-ink);container-type:inline-size;font-family:"Cormorant Garamond","Noto Serif Sinhala",Georgia,serif;color:#4A3F38;position:relative;
  background:var(--lx-l) left top/82px auto repeat-y,var(--lx-r) right top/82px auto repeat-y,
  linear-gradient(118deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.55) 30%,rgba(255,255,255,0) 42%,rgba(255,255,255,.4) 62%,rgba(255,255,255,0) 74%),
  linear-gradient(165deg,#F8F3EA,#EEE4D3 48%,#F7F0E4);background-color:#F3ECDF}
.site.lotus.locked > :not(.lx-cover){display:none!important}
.site.lotus:not(.locked) > .lx-cover{display:none}
.lx-cover,.lx-hero{position:relative;overflow:hidden;min-height:min(100svh,820px);display:grid;align-items:center;justify-items:center;text-align:center;padding:calc(min(100cqw,520px)*.5 + 6px) 26px 150px}
.phone .lx-cover{min-height:100%;height:100%}
.phone .site.lotus.locked{height:100%}
.site.lotus.opening .lx-cover{animation:lxout .65s ease forwards}
@keyframes lxout{to{opacity:0;transform:scale(1.04)}}
.lx-mandala{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(100cqw,520px);height:auto;opacity:.9;pointer-events:none}
.lx-in{position:relative;z-index:2;display:grid;justify-items:center;gap:14px;max-width:340px}
.lx-eb{font-size:14px;letter-spacing:.42em;text-transform:uppercase;color:var(--c-gold);font-weight:600}
.lx-rule{display:flex;align-items:center;gap:12px;color:var(--c-gold);font-size:11px;width:200px}
.lx-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--c-gold))}.lx-rule i:last-child{transform:scaleX(-1)}
.lx-names{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;color:var(--lx-wine);font-size:62px;line-height:1.02;margin:6px 0;display:grid;letter-spacing:-.01em}
.lx-names span{font-size:.55em;color:var(--c-gold);font-weight:500;margin:4px 0}
.lx-names.one{display:block;font-size:44px}
.lx-names.one span{font-size:1em;color:var(--lx-wine);opacity:.75}
.lx-date{font-size:22px;letter-spacing:.04em;color:#4A3F38;margin:0}
.lx-dear{font-style:italic;font-size:21px;color:var(--lx-wine);margin:2px 0 14px}
.lx-open{display:inline-flex;align-items:center;gap:14px;border:2px solid var(--lx-wine);background:rgba(255,253,248,.35);color:var(--lx-wine);border-radius:999px;padding:15px 26px;font:700 14px "Cormorant Garamond",serif;letter-spacing:.26em;white-space:nowrap;text-transform:uppercase;cursor:pointer;animation:lxpulse 2.6s ease-in-out infinite}
.lx-open svg{width:28px;height:18px}
.lx-open:hover{background:var(--lx-wine);color:#FFF8EE}
@keyframes lxpulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--lx-wine) 10%,transparent)}}
.lx-sw{font-family:"Noto Serif Sinhala",serif;font-weight:700;font-size:24px;color:var(--c-gold);margin:6px 0 0}
.lx-tag{font-size:15px;letter-spacing:.3em;text-transform:uppercase;line-height:2;color:#4A3F38;margin:0}
.lx-down{border:0;background:none;display:grid;justify-items:center;gap:10px;color:var(--c-gold);cursor:pointer;margin-top:24px;font:600 13px "Cormorant Garamond",serif;letter-spacing:.34em;text-transform:uppercase}
.lx-down span{width:46px;height:46px;border:1px solid var(--c-gold);border-radius:50%;display:grid;place-items:center;color:var(--lx-wine);animation:lxbob 2s ease-in-out infinite}
.lx-down svg{width:20px;height:20px}
@keyframes lxbob{50%{transform:translateY(6px)}}
.lx-bq{position:absolute;bottom:-6px;width:50%;max-width:250px;height:auto;z-index:1;pointer-events:none}
.lx-bq.l{left:-6%}.lx-bq.r{right:-6%;transform:scaleX(-1)}
.lx-bq .sw1,.lx-bq .sw2{transform-box:fill-box;transform-origin:50% 100%;animation:lxsway 7s ease-in-out infinite alternate}
.lx-bq .sw2{animation-duration:5.5s;animation-delay:-2s}
@keyframes lxsway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
.lx-dust{position:absolute;inset:0;pointer-events:none;z-index:1}
.lx-dust i{position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(#E9CF92,transparent 70%);animation:lxdust 6s ease-in-out infinite;opacity:0}
@keyframes lxdust{30%{opacity:.9}60%{opacity:.3}100%{opacity:0;transform:translateY(-30px)}}
.lx-top{position:sticky;top:0;z-index:6;display:grid;place-items:center;padding:10px 0 8px;background:color-mix(in srgb,#F4EDE0 92%,transparent);border-bottom:1px solid color-mix(in srgb,var(--c-gold) 35%,transparent)}
.lx-mono{width:68px;height:auto}

.site.lotus .s-sec{background:rgba(255,253,248,.86);margin:22px 16px;border:1px solid color-mix(in srgb,var(--c-gold) 55%,transparent);border-radius:30px;outline:1px solid color-mix(in srgb,var(--c-gold) 30%,transparent);outline-offset:-10px;padding:40px 22px;box-shadow:0 18px 40px -26px rgba(90,60,30,.35)}
.site.lotus .s-eb{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.36em;font-weight:600;color:var(--c-gold)}
.site.lotus .s-h{font-family:"Playfair Display",serif;color:var(--lx-wine);font-size:30px;font-weight:700}
.site.lotus .s-p{font-size:18px;color:#4A3F38;max-width:30ch}
.site.lotus .s-p b{color:var(--lx-wine)}
.site.lotus .s-date b,.site.lotus .s-year,.site.lotus .s-ev .t,.site.lotus .s-step output{color:var(--lx-wine);font-family:"Cormorant Garamond",serif}
.site.lotus .s-date span{font-size:17px;color:#4A3F38}
.site.lotus .s-cd div,.site.lotus .s-ev,.site.lotus .s-row,.site.lotus .s-form{background:#FFFDF8}
.site.lotus .s-cd b{color:var(--lx-wine);font-family:"Cormorant Garamond",serif;font-size:30px}
.site.lotus .s-btn,.site.lotus .s-choice button[aria-pressed="true"],.site.lotus .s-row i{background:var(--lx-wine);color:#FFF8EE;border-color:var(--lx-wine)}
.site.lotus .s-form,.site.lotus .s-ev,.site.lotus .s-row,.site.lotus .s-cd div{font-family:var(--f-body)}
.lx-photo{margin:0 0 6px;width:100%;max-width:340px;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c-gold) 45%,transparent)}
.lx-photo img{width:100%;height:100%;object-fit:cover;display:block}
.lx-ph{display:grid;place-items:center;background:linear-gradient(165deg,#F9F4EB,#EDE2CF);aspect-ratio:2/1}
.lx-mini{width:80%;height:auto}
.lx-heart{display:flex;align-items:center;gap:12px;color:var(--c-gold);width:160px}.lx-heart i{flex:1;height:1px;background:var(--c-gold);opacity:.6}
.site.lotus .s-foot{color:#6E625A}
.lx-fabs{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:space-between;padding:0 16px;margin-top:-60px;pointer-events:none}
.lx-fab{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--lx-wine) 75%,#fff),var(--lx-wine));color:#FFF8EE;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px -8px rgba(80,10,20,.55)}
.lx-fab svg{width:22px;height:22px}
.lx-fab .m-off,.lx-fab.on .m-on{display:block}.lx-fab .m-on,.lx-fab.on .m-off{display:none}
.lx-fab[data-music].on{animation:lxring 1.8s ease-out infinite}
@keyframes lxring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lx-wine) 45%,transparent),0 10px 24px -8px rgba(80,10,20,.55)}100%{box-shadow:0 0 0 14px transparent,0 10px 24px -8px rgba(80,10,20,.55)}}
.lx-sheet{pointer-events:auto;position:absolute;left:16px;bottom:66px;background:#FFFDF8;border:1px solid color-mix(in srgb,var(--c-gold) 50%,transparent);border-radius:20px;padding:8px;display:grid;min-width:200px;box-shadow:0 20px 40px -18px rgba(60,30,10,.4)}
.lx-sheet button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;font:600 15px var(--f-body);color:var(--lx-wine);cursor:pointer;text-align:left}
.lx-sheet button:hover{background:#F6EFE3}
.lx-sheet svg{width:18px;height:18px;color:var(--c-gold)}
.site.lotus .snav{display:none}
@media (prefers-reduced-motion:reduce){.lx-bq g,.lx-dust i,.lx-open,.lx-down span,.lx-fab.on{animation:none!important}}
/* card thumbnail */
.card.L-lotus{background:var(--lx-l) left top/17cqw auto repeat-y,var(--lx-r) right top/17cqw auto repeat-y,linear-gradient(118deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.55) 32%,rgba(255,255,255,0) 46%),linear-gradient(165deg,#F9F4EB,#EDE2CF 52%,#F7F0E4)}
.card.L-lotus .frame,.card.L-lotus .corner{display:none}
.card.L-lotus .art{padding:0 0 0;display:block}
.card.L-lotus .art svg{width:100%;max-height:none;display:block}
.card.L-lotus .names{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:10cqw}
.card.L-lotus .txt{padding:0 15cqw 12cqw;gap:1.6cqw}
/* ================= LANDING (taste-skill: sentence as layout) ================= */
.lp{--l-bg:#FFF3E3;--l-surface:#FBE6C8;--l-ink:#2A1E12;--l-muted:#6E5D48;--l-accent:#C9993A;--l-accent-ink:#2A1E12;
  --l-paper:#FFFFFF;--l-paper-ink:#2A1E12;--l-paper-soft:#6E5D48;--l-tone:#FFF8EE;
  --l-maroon:#B3852B;--l-betel:#FFF8EE;--l-lotus:#FBE6C8;--l-deep:#A67A1F;--l-gold:#F3DDA8;--l-dark:#2A1E12;
  --s-small:clamp(.8125rem,.79rem + .1vw,.875rem);--s-body:clamp(1.0625rem,1rem + .25vw,1.1875rem);--s-lead:clamp(1.25rem,1.1rem + .7vw,1.625rem);--s-head:clamp(2rem,1.3rem + 3.2vw,4rem);
  --m:clamp(16px,2.2vw,32px);
  font-family:"Inter Tight","Noto Sans Sinhala",system-ui,sans-serif;font-size:var(--s-body);line-height:1.5;letter-spacing:-.005em;color:var(--l-paper-ink);background:var(--l-paper)}
.lp h1,.lp h2,.lp h3{font-family:"Inter Tight","Noto Sans Sinhala",system-ui,sans-serif;font-weight:600;letter-spacing:-.04em;line-height:.95;margin:0;text-wrap:balance}
.lp p{margin:0}
.lp a{color:inherit}
.lp .g{padding-inline:var(--m)}
.lp .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lp-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--l-accent);color:var(--l-accent-ink);font:600 var(--s-body)/1 "Inter Tight",sans-serif;letter-spacing:-.01em;text-decoration:none;cursor:pointer;transition:transform .15s,background .2s}
.lp-btn:hover{background:var(--l-maroon)}.lp-btn:active{transform:translateY(1px) scale(.98)}
.lp .lp-btn{color:var(--l-accent-ink)}
.lp .lp-btn.dark{color:#fff}
.lp-btn.dark{background:var(--l-dark);color:#fff}.lp-btn.dark:hover{background:#4A3820}
.lp-link{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px;cursor:pointer}
.lp-link:hover{text-decoration-thickness:2px}

/* nav: takes the ink of the chapter beneath it */
.lp-nav{position:fixed;inset:0 0 auto;z-index:40;display:flex;align-items:center;gap:28px;padding:16px var(--m);background:rgba(255,243,227,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--l-ink);border-bottom:1px solid rgba(169,123,34,.18);transition:background .3s}
.lp-nav .wm{display:flex;align-items:baseline;gap:10px;text-decoration:none;font-weight:600;font-size:var(--s-lead);letter-spacing:-.03em}
.lp-nav .wm span{font-family:"Noto Sans Sinhala",sans-serif;font-weight:600;font-size:var(--s-body);letter-spacing:0}
.lp-nav nav{margin-left:auto;display:flex;gap:24px;align-items:center}
.lp-nav nav a{text-decoration:none;font-size:var(--s-body)}
.lp-nav nav a:hover{text-decoration:underline;text-underline-offset:.25em}
.lp-nav .lp-btn{min-height:44px;padding:0 18px}
.lp-nav .menu{display:none}
@media (max-width:860px){.lp-nav nav a:not(.keep){display:none}.lp-nav nav{gap:14px}.lp-nav .wm span{display:none}.lp-nav{gap:12px;padding-block:10px}.lp-nav .lp-btn{min-height:40px;padding:0 12px;font-size:15px}.lp-nav .wm{font-size:20px}}

/* hero: two fields, headline across the seam */
.lp-hero{position:relative;min-height:100svh;display:grid;align-content:center;background:var(--l-bg);overflow:hidden;--seam:50%}
.lp-hero::before{content:"";position:absolute;inset:0}
.lp-hero > *{position:relative}
.lp-hero .h1w{position:relative;display:grid;justify-items:center;padding-inline:var(--m)}
.lp-hero .hl{grid-area:1/1;font-size:clamp(72px,9.5vw,150px);line-height:.92;letter-spacing:-.045em;text-align:center;font-weight:700}
.lp-hero .hl .ln{display:block;white-space:nowrap}
.lp-hero .h1w{transform:translateY(-15%)}
.lp-hero .hl.up{position:relative;z-index:2}.lp-hero .hl.dn{z-index:1}
.lp-hero .hl.dn .ln::before{content:attr(data-t)}
.lp-hero .hl.up{color:var(--l-ink);clip-path:inset(0 0 50% 0)}
.lp-hero .hl.dn{color:#A67A1F;clip-path:inset(50% 0 0 0)}
.lp-hero .hl.dn .ln::before{background:linear-gradient(100deg,#9A6E1C 0%,#C9993A 30%,#F2D27A 45%,#C9993A 60%,#9A6E1C 100%) 0 0/260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lpshine 7s linear infinite}
@keyframes lpshine{to{background-position:-260% 0}}
.lp-hero .slot{display:inline-block;width:2.3em;height:.74em;vertical-align:baseline;margin-left:.12em;overflow:hidden;border-radius:.12em;position:relative;top:.02em}
.lp-hero .slot img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;animation:lpdrift 14s ease-in-out infinite alternate}
@keyframes lpdrift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-4%,3%)}}
